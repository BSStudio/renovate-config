name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate presets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
      # Unpinned on purpose: validate against the schema the hosted app runs.
      - name: Validate presets
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global default.json weekly.json monthly.json approve-merges.json
      - name: Validate repo config
        run: npx --yes --package renovate -- renovate-config-validator --strict --no-global .github/renovate.json
